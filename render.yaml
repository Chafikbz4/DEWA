# Render blueprint for the DEWA backend.
# Deploy: Render dashboard → New → Blueprint → pick this repo. It reads this file.
# Reuses the existing Neon database (schema + demo data already in place), so set
# DATABASE_URL / DATABASE_URL_UNPOOLED / ENCRYPTION_KEY from backend/.env in the
# dashboard (marked sync:false below). See DEPLOY.md.
services:
  - type: web
    name: dewa-backend
    runtime: node
    rootDir: backend
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Demo mode: console SMS/email (OTP printed in logs); team uses seeded
      # accounts that do not need OTP. Production needs real providers + NODE_ENV=production.
      - key: NODE_ENV
        value: development
      - key: TRUST_PROXY
        value: "true"
      - key: SWAGGER_ENABLED
        value: "true"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: SMS_PROVIDER
        value: console
      - key: EMAIL_PROVIDER
        value: console
      - key: STORAGE_DRIVER
        value: local
      - key: JOBS_ENABLED
        value: "true"
      - key: LOG_FORMAT
        value: pretty
      # Any origin is allowed for the demo (token-based API, no cookies).
      # Tighten to the Vercel URL for production.
      - key: CORS_ORIGINS
        value: "*"
      # Secrets — set in the dashboard. DB values are copied from backend/.env.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      # Generated by Render (fine to be fresh for the demo).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: HASH_PEPPER
        generateValue: true
