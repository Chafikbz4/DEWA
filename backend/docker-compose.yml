# Local stack: API + PostgreSQL (PostGIS) + Redis.
# Usage: cp .env.example .env  (fill the secrets)  →  docker compose up --build
# The API container talks to the local Postgres below, not to Neon.
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: dewa
      POSTGRES_USER: dewa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dewa_local_only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dewa -d dewa"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://dewa:${POSTGRES_PASSWORD:-dewa_local_only}@postgres:5432/dewa
      DATABASE_URL_UNPOOLED: postgres://dewa:${POSTGRES_PASSWORD:-dewa_local_only}@postgres:5432/dewa
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
