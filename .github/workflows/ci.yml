name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lint (no autofix)
        run: npx eslint "{src,test,scripts}/**/*.ts" --max-warnings=0
      - name: Format check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npx jest --ci
      - name: Build
        run: npm run build
      - name: Dependency audit (high and critical)
        # Non-blocking until the NestJS 10 → 11 upgrade (open item in docs/10-security-review.md).
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end tests (disposable PostGIS)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 60
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: dewa
          POSTGRES_PASSWORD: dewa
          POSTGRES_DB: dewa_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dewa -d dewa_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Write .env.test (throw-away secrets, local database only)
        run: |
          cp .env.example .env.test
          {
            echo "NODE_ENV=test"
            echo "DATABASE_URL=postgres://dewa:dewa@localhost:5432/dewa_e2e"
            echo "DATABASE_URL_UNPOOLED=postgres://dewa:dewa@localhost:5432/dewa_e2e"
            echo "NEON_BRANCH=ci-local"
            echo "REDIS_URL="
            echo "JWT_ACCESS_SECRET=$(openssl rand -base64 48)"
            echo "ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "HASH_PEPPER=$(openssl rand -base64 32)"
            echo "STORAGE_DRIVER=local"
            echo "STORAGE_LOCAL_DIR=/tmp/dewa-storage"
            echo "PAYMENT_PROVIDER=mock"
            echo "JOBS_ENABLED=false"
            echo "SWAGGER_ENABLED=false"
            echo "RATE_LIMIT_GLOBAL_PER_MINUTE=5000"
            echo "RATE_LIMIT_AUTH_IP_PER_MINUTE=1000"
            echo "RATE_LIMIT_AUTH_ACCOUNT_PER_15_MIN=50"
            echo "NOTIFICATION_RETRY_BASE_MS=20"
            echo "SEED_SUPER_ADMIN_EMAIL="
            echo "SEED_SUPER_ADMIN_PASSWORD="
          } >> .env.test
      - name: e2e
        run: npx jest --config ./test/jest-e2e.json --ci
